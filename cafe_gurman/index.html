<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Наши социальные сети — Gurman (Душевная кухня)</title>
</head>
<body style="margin: 0; padding: 0; width: 100%; height: 100%; background-color: #f7e8c3; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent;">

<!-- ГЛАВНЫЙ ФОНОВЫЙ КОНТЕЙНЕР -->
<div style="width: 100%; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px 16px; box-sizing: border-box; background: linear-gradient(135deg, #fdfbf7 0%, #f7e8c3 50%, #edd39a 100%); overflow: hidden;">

    <!-- КАРТОЧКА (GLASSMORPHISM) -->
    <div style="width: 100%; max-width: 420px; padding: 36px 20px; text-align: center; box-sizing: border-box; background: rgba(255, 255, 255, 0.65); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border-radius: 28px; border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: 0 20px 40px rgba(70, 50, 10, 0.12), inset 0 1px 1px rgba(255, 255, 255, 0.9); position: relative;">

        <!-- ВЕРХНЯЯ ЗОЛОТАЯ ЛИНИЯ -->
        <div style="position: absolute; top: 0; left: 15%; width: 70%; height: 3px; background: linear-gradient(90deg, transparent, #d4a017, #f3c649, #d4a017, transparent); border-radius: 10px;"></div>

        <!-- ЛОГОТИП -->
        <div style="width: 120px; height: 120px; margin: 0 auto 18px; border-radius: 50%;">
            <svg style="width: 100%; height: 100%; display: block; border-radius: 50%;" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="bgYellowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ffe366"/>
                        <stop offset="50%" stop-color="#f5c010"/>
                        <stop offset="100%" stop-color="#d49b00"/>
                    </linearGradient>
                </defs>

                <circle cx="150" cy="150" r="142" fill="url(#bgYellowGradient)" stroke="#2c210d" stroke-width="4"/>
                <circle cx="150" cy="150" r="132" fill="none" stroke="#2c210d" stroke-width="1.8" stroke-dasharray="6,4" opacity="0.65"/>

                <g fill="#2c210d" stroke="#2c210d">
                    <g transform="translate(150, 108) rotate(45)">
                        <path d="M -2, -35 C 10, -32 14, -10 14, 0 L -2, 0 Z"/>
                        <rect x="-3" y="0" width="18" height="3" rx="1"/>
                        <rect x="-1" y="3" width="14" height="26" rx="3"/>
                    </g>
                    <g transform="translate(150, 108) rotate(-45)">
                        <path d="M 2, -35 C -10, -32 -14, -10 -14, 0 L 2, 0 Z"/>
                        <rect x="-15" y="0" width="18" height="3" rx="1"/>
                        <rect x="-13" y="3" width="14" height="26" rx="3"/>
                    </g>
                </g>

                <text x="150" y="196" font-family="'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="900" fill="#2c210d" text-anchor="middle" letter-spacing="4">GURMAN</text>
                <text x="150" y="218" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#4a3713" text-anchor="middle" letter-spacing="2.5">ДУШЕВНАЯ КУХНЯ</text>

                <g fill="#2c210d">
                    <polygon points="150,228 152,233 158,233 153,237 155,242 150,239 145,242 147,237 142,233 148,233"/>
                    <polygon points="122,228 123.5,232 128,232 124.5,235 126,239 122,236.5 118,239 119.5,235 116,232 120.5,232" opacity="0.8"/>
                    <polygon points="178,228 179.5,232 184,232 180.5,235 182,239 178,236.5 174,239 175.5,235 172,232 176.5,232" opacity="0.8"/>
                </g>
            </svg>
        </div>

        <!-- ПЕРЕКЛЮЧАТЕЛЬ ЯЗЫКА -->
        <div style="display: flex; justify-content: center; gap: 8px; margin-bottom: 18px;">
            <button id="ruBtn" onclick="setLanguage('ru')" 
                    style="border: 1px solid #2c251e; background: #2c251e; color: #f3c649; padding: 6px 16px; border-radius: 20px; cursor: pointer; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; transition: all 0.2s ease;"
                    onmouseover="this.style.transform='scale(1.08)'"
                    onmouseout="this.style.transform='scale(1)'">RU</button>
            <button id="kzBtn" onclick="setLanguage('kz')" 
                    style="border: 1px solid rgba(212, 160, 23, 0.4); background: rgba(255, 255, 255, 0.6); color: #8a6300; padding: 6px 16px; border-radius: 20px; cursor: pointer; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; transition: all 0.2s ease;"
                    onmouseover="this.style.transform='scale(1.08)'"
                    onmouseout="this.style.transform='scale(1)'">KZ</button>
        </div>

        <!-- ЗАГОЛОВОК И ТЕКСТ -->
        <h1 id="title" style="font-size: 22px; font-weight: 800; margin: 0 0 10px 0; color: #2c251e; letter-spacing: -0.3px;">
            Мы в <span style="color: #b8860b;">социальных сетях</span>
        </h1>

        <p id="subtitle" style="margin: 0 auto 20px; color: #4a3e33; font-size: 13px; line-height: 1.5; font-weight: 400;">
            Следите за новинками нашего меню, акциями и специальными предложениями. Нам всегда важно ваше мнение! ❤️
        </p>

        <!-- ДЕКОРАТИВНЫЙ РАЗДЕЛИТЕЛЬ -->
        <div style="display: flex; align-items: center; justify-content: center; width: 60%; margin: 0 auto 20px;">
            <div style="height: 1px; flex: 1; background: linear-gradient(90deg, transparent, rgba(184, 134, 11, 0.4));"></div>
            <span style="color: #b8860b; font-size: 12px; margin: 0 8px;">✦</span>
            <div style="height: 1px; flex: 1; background: linear-gradient(90deg, rgba(184, 134, 11, 0.4), transparent);"></div>
        </div>

        <!-- АНИМИРОВАННЫЕ КНОПКИ СОЦСЕТЕЙ -->
        <div style="display: flex; justify-content: center; gap: 12px;">
            <!-- INSTAGRAM -->
            <a href="https://www.instagram.com/kafe.gurman_talgar" target="_blank" 
               style="flex: 1; max-width: 160px; height: 96px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-decoration: none; background: rgba(255, 255, 255, 0.55); border-radius: 18px; border: 1px solid rgba(255, 255, 255, 0.8); box-sizing: border-box; transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;"
               onmouseover="this.style.transform='translateY(-4px)'; this.style.backgroundColor='rgba(255, 255, 255, 0.85)'; this.style.boxShadow='0 10px 20px rgba(184, 134, 11, 0.15)';"
               onmouseout="this.style.transform='translateY(0)'; this.style.backgroundColor='rgba(255, 255, 255, 0.55)'; this.style.boxShadow='none';">
                
                <svg width="36" height="36" viewBox="0 0 24 24" style="margin-bottom: 6px;">
                    <defs>
                        <linearGradient id="instagramGradient" x1="0%" y1="100%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#FFDC80" />
                            <stop offset="25%" stop-color="#FCB045" />
                            <stop offset="50%" stop-color="#F77737" />
                            <stop offset="75%" stop-color="#E1306C" />
                            <stop offset="100%" stop-color="#833AB4" />
                        </linearGradient>
                    </defs>
                    <path fill="url(#instagramGradient)" d="M7.5 2h9A5.5 5.5 0 0 1 22 7.5v9a5.5 5.5 0 0 1-5.5 5.5h-9A5.5 5.5 0 0 1 2 16.5v-9A5.5 5.5 0 0 1 7.5 2zm0 2A3.5 3.5 0 0 0 4 7.5v9A3.5 3.5 0 0 0 7.5 20h9a3.5 3.5 0 0 0 3.5-3.5v-9A3.5 3.5 0 0 0 16.5 4h-9zM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm5.25-3.25a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5z"/>
                </svg>
                <span id="instagramText" style="font-size: 13px; font-weight: 700; color: #2c251e;">Instagram</span>
            </a>

            <!-- 2GIS -->
            <a href="https://2gis.kz/almaty/search/%D0%93%D1%83%D1%80%D0%BC%D0%B0%D0%BD/firm/70000001116317541/77.246969%2C43.310402/tab/reviews?m=77.246969%2C43.310402%2F17.06" target="_blank" 
               style="flex: 1; max-width: 160px; height: 96px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-decoration: none; background: rgba(255, 255, 255, 0.55); border-radius: 18px; border: 1px solid rgba(255, 255, 255, 0.8); box-sizing: border-box; transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;"
               onmouseover="this.style.transform='translateY(-4px)'; this.style.backgroundColor='rgba(255, 255, 255, 0.85)'; this.style.boxShadow='0 10px 20px rgba(0, 166, 81, 0.15)';"
               onmouseout="this.style.transform='translateY(0)'; this.style.backgroundColor='rgba(255, 255, 255, 0.55)'; this.style.boxShadow='none';">
                
                <svg width="36" height="36" viewBox="0 0 24 24" style="margin-bottom: 6px;">
                    <path fill="#00a651" d="M12 2C7.58 2 4 5.58 4 10c0 5.5 8 12 8 12s8-6.5 8-12c0-4.42-3.58-8-8-8zm0 11.2a3.2 3.2 0 1 1 0-6.4 3.2 3.2 0 0 1 0 6.4z"/>
                </svg>
                <span id="gisText" style="font-size: 13px; font-weight: 700; color: #2c251e;">2GIS</span>
            </a>
        </div>

        <!-- БЛОК ОТЗЫВА -->
        <div style="margin-top: 20px; padding: 14px 16px; border-radius: 16px; background: rgba(255, 255, 255, 0.5); border: 1px solid rgba(255, 255, 255, 0.8); color: #4a3e33; font-size: 12px; line-height: 1.5; box-sizing: border-box;">
            ⭐ <strong id="reviewTitle" style="color: #8a6300;">Ваше мнение важно!</strong><br>
            <span id="reviewText">Оставьте отзыв после посещения — это помогает нам становиться лучше.</span>
        </div>

        <!-- НИЖНИЙ ТЕКСТ -->
        <div style="margin-top: 18px; color: #8a6300; font-size: 11px; letter-spacing: 0.5px; text-transform: uppercase; font-weight: 700;">
            <span id="bottomText">Спасибо, что выбираете нас</span> ✨
        </div>

    </div>
</div>

<script>
function setLanguage(language) {
    const title = document.getElementById("title");
    const subtitle = document.getElementById("subtitle");
    const reviewTitle = document.getElementById("reviewTitle");
    const reviewText = document.getElementById("reviewText");
    const bottomText = document.getElementById("bottomText");
    const ruBtn = document.getElementById("ruBtn");
    const kzBtn = document.getElementById("kzBtn");

    if (language === "kz") {
        title.innerHTML = 'Біз <span style="color: #b8860b;">әлеуметтік желілердеміз</span>';
        subtitle.innerHTML = 'Мәзіріміздің жаңалықтарын, акциялар мен арнайы ұсыныстарды бақылаңыз. Сіздің пікіріңіз біз үшін өте маңызды! ❤️';
        reviewTitle.innerHTML = 'Сіздің пікіріңіз маңызды!';
        reviewText.innerHTML = 'Қонақ болғаннан кейін пікір қалдырыңыз — бұл бізге одан әрі жақсаруға көмектеседі.';
        bottomText.innerHTML = 'Бізді таңдағаныңызға рақмет';
        
        // Переключение стилей кнопок
        kzBtn.style.background = '#2c251e';
        kzBtn.style.color = '#f3c649';
        kzBtn.style.borderColor = '#2c251e';
        
        ruBtn.style.background = 'rgba(255, 255, 255, 0.6)';
        ruBtn.style.color = '#8a6300';
        ruBtn.style.borderColor = 'rgba(212, 160, 23, 0.4)';
    } else {
        title.innerHTML = 'Мы в <span style="color: #b8860b;">социальных сетях</span>';
        subtitle.innerHTML = 'Следите за новинками нашего меню, акциями и специальными предложениями. Нам всегда важно ваше мнение! ❤️';
        reviewTitle.innerHTML = 'Ваше мнение важно!';
        reviewText.innerHTML = 'Оставьте отзыв после посещения — это помогает нам становиться лучше.';
        bottomText.innerHTML = 'Спасибо, что выбираете нас';
        
        // Переключение стилей кнопок
        ruBtn.style.background = '#2c251e';
        ruBtn.style.color = '#f3c649';
        ruBtn.style.borderColor = '#2c251e';
        
        kzBtn.style.background = 'rgba(255, 255, 255, 0.6)';
        kzBtn.style.color = '#8a6300';
        kzBtn.style.borderColor = 'rgba(212, 160, 23, 0.4)';
    }
}
</script>

</body>
</html>
