<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Наши социальные сети</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;

            color: white;

            background:
                radial-gradient(circle at 10% 10%, rgba(230, 0, 18, 0.25), transparent 30%),
                radial-gradient(circle at 90% 90%, rgba(230, 0, 18, 0.2), transparent 30%),
                radial-gradient(circle at 50% 50%, #1a0003, #050505 65%);

            overflow: hidden;
            position: relative;
        }

        /* =========================
           ФОНОВЫЕ ЭФФЕКТЫ
        ========================= */

        body::before {
            content: "";
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            border: 1px solid rgba(255, 0, 30, 0.15);
            box-shadow:
                0 0 80px rgba(230, 0, 18, 0.12),
                inset 0 0 80px rgba(230, 0, 18, 0.08);
            animation: rotate 25s linear infinite;
        }

        body::after {
            content: "";
            position: absolute;
            width: 850px;
            height: 850px;
            border-radius: 50%;
            border: 1px solid rgba(255, 0, 30, 0.08);
            animation: rotateReverse 35s linear infinite;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes rotateReverse {
            from {
                transform: rotate(360deg);
            }

            to {
                transform: rotate(0deg);
            }
        }

        /* Красные светящиеся круги */

        .circle {
            position: absolute;
            border-radius: 50%;
            background: #e60012;
            filter: blur(5px);
            opacity: 0.12;
        }

        .circle1 {
            width: 350px;
            height: 350px;
            top: -180px;
            left: -150px;
        }

        .circle2 {
            width: 300px;
            height: 300px;
            bottom: -150px;
            right: -120px;
        }

        .circle3 {
            width: 80px;
            height: 80px;
            top: 15%;
            right: 12%;
            opacity: 0.3;
            filter: blur(20px);
        }

        /* =========================
           ТОЧКИ
        ========================= */

        .dot {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #ff0019;
            box-shadow: 0 0 15px #ff0019;
            animation: pulse 2s infinite;
        }

        .dot1 {
            top: 15%;
            left: 10%;
        }

        .dot2 {
            top: 70%;
            left: 7%;
            animation-delay: .5s;
        }

        .dot3 {
            top: 25%;
            right: 8%;
            animation-delay: 1s;
        }

        .dot4 {
            bottom: 12%;
            right: 15%;
            animation-delay: 1.5s;
        }

        .dot5 {
            top: 50%;
            left: 4%;
            animation-delay: .8s;
        }

        .dot6 {
            bottom: 25%;
            right: 5%;
            animation-delay: 1.2s;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: .3;
            }

            50% {
                transform: scale(2);
                opacity: 1;
            }
        }

        /* =========================
           ОСНОВНАЯ КАРТОЧКА
        ========================= */

        .card {
            position: relative;
            z-index: 5;

            width: 92%;
            max-width: 700px;

            padding: 55px 40px;

            text-align: center;

            background:
                linear-gradient(
                    145deg,
                    rgba(25, 25, 25, 0.97),
                    rgba(5, 5, 5, 0.97)
                );

            border-radius: 30px;

            border: 1px solid rgba(255, 0, 25, 0.35);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.8),
                0 0 50px rgba(230, 0, 18, 0.08),
                inset 0 0 40px rgba(230, 0, 18, 0.03);

            animation: appear .8s ease;
        }

        /* Красная линия сверху */

        .card::before {
            content: "";

            position: absolute;

            top: 0;
            left: 10%;

            width: 80%;
            height: 2px;

            background: linear-gradient(
                90deg,
                transparent,
                #ff0019,
                transparent
            );

            box-shadow: 0 0 15px #ff0019;
        }

        /* Красная линия снизу */

        .card::after {
            content: "";

            position: absolute;

            bottom: 0;
            left: 25%;

            width: 50%;
            height: 1px;

            background: #e60012;

            box-shadow: 0 0 15px #e60012;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(40px) scale(.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* =========================
           ЛОГОТИП
        ========================= */

        .logo {
            width: 90px;
            height: 90px;

            margin: 0 auto 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(145deg, #ff0019, #9e000d);

            color: white;

            border-radius: 50%;

            font-size: 42px;

            box-shadow:
                0 0 0 5px rgba(230, 0, 18, 0.08),
                0 0 30px rgba(230, 0, 18, 0.5),
                0 10px 30px rgba(0, 0, 0, .7);

            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        /* =========================
           ЗАГОЛОВОК
        ========================= */

        h1 {
            font-size: 35px;
            margin-bottom: 12px;

            color: white;

            text-shadow:
                0 0 20px rgba(255, 255, 255, .08);
        }

        h1 span {
            color: #ff0019;
            text-shadow: 0 0 15px rgba(255, 0, 25, .5);
        }

        .subtitle {
            color: #999;

            font-size: 15px;

            line-height: 1.6;

            max-width: 520px;

            margin: 0 auto 35px;
        }

        /* =========================
           РАЗДЕЛИТЕЛЬ
        ========================= */

        .divider {
            display: flex;
            align-items: center;
            gap: 15px;

            margin: 0 auto 30px;

            width: 85%;
        }

        .divider::before,
        .divider::after {
            content: "";

            height: 1px;

            flex: 1;

            background: linear-gradient(
                90deg,
                transparent,
                #e60012
            );
        }

        .divider::after {
            background: linear-gradient(
                90deg,
                #e60012,
                transparent
            );
        }

        .divider span {
            color: #e60012;
            font-size: 12px;
        }

        /* =========================
           СОЦИАЛЬНЫЕ КНОПКИ
        ========================= */

        .socials {
            display: flex;

            justify-content: center;

            gap: 20px;

            flex-wrap: wrap;
        }

        .social {
            position: relative;

            width: 140px;
            height: 140px;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-decoration: none;

            color: white;

            background:
                linear-gradient(
                    145deg,
                    #181818,
                    #090909
                );

            border-radius: 24px;

            border: 1px solid #292929;

            overflow: hidden;

            transition:
                transform .35s ease,
                box-shadow .35s ease,
                border-color .35s ease;
        }

        /* Свет внутри карточки */

        .social::before {
            content: "";

            position: absolute;

            width: 100px;
            height: 100px;

            border-radius: 50%;

            background: rgba(255, 0, 25, .04);

            filter: blur(20px);

            transition: .4s;
        }

        .social:hover::before {
            background: rgba(255, 0, 25, .15);

            transform: scale(1.5);
        }

        .social svg {
            position: relative;
            z-index: 2;

            width: 48px;
            height: 48px;

            margin-bottom: 12px;

            transition: transform .35s ease;
        }

        .social span {
            position: relative;
            z-index: 2;

            font-size: 14px;

            font-weight: bold;

            letter-spacing: .5px;
        }

        .social:hover {
            transform: translateY(-12px) scale(1.03);

            border-color: #e60012;

            box-shadow:
                0 20px 40px rgba(0, 0, 0, .7),
                0 0 25px rgba(230, 0, 18, .2);
        }

        .social:hover svg {
            transform: scale(1.15);
        }

        /* =========================
           INSTAGRAM
        ========================= */

        .instagram svg {
            fill: url(#instagramGradient);
        }

        .instagram:hover {
            border-color: #ff0055;
            box-shadow:
                0 20px 40px rgba(0, 0, 0, .7),
                0 0 30px rgba(225, 48, 108, .25);
        }

        /* =========================
           2GIS
        ========================= */

        .gis svg {
            fill: #00a651;
        }

        .gis:hover {
            border-color: #00a651;

            box-shadow:
                0 20px 40px rgba(0, 0, 0, .7),
                0 0 30px rgba(0, 166, 81, .2);
        }

        /* =========================
           TIKTOK
        ========================= */

        .tiktok svg {
            fill: white;

            filter:
                drop-shadow(2px 2px 0 #ff0050)
                drop-shadow(-2px -2px 0 #00f2ea);
        }

        .tiktok:hover {
            border-color: #00f2ea;

            box-shadow:
                0 20px 40px rgba(0, 0, 0, .7),
                0 0 30px rgba(0, 242, 234, .18);
        }

        /* =========================
           НИЖНИЙ ТЕКСТ
        ========================= */

        .bottom-text {
            margin-top: 35px;

            color: #555;

            font-size: 11px;

            letter-spacing: 2px;

            text-transform: uppercase;

            transition: .3s;
        }

        .bottom-text:hover {
            color: #e60012;

            text-shadow: 0 0 10px rgba(230, 0, 18, .4);
        }

        /* =========================
           ДОПОЛНИТЕЛЬНЫЕ ЛИНИИ
        ========================= */

        .corner {
            position: absolute;

            width: 25px;
            height: 25px;

            border-color: #e60012;
            border-style: solid;

            opacity: .7;
        }

        .corner1 {
            top: 20px;
            left: 20px;

            border-width: 2px 0 0 2px;
        }

        .corner2 {
            top: 20px;
            right: 20px;

            border-width: 2px 2px 0 0;
        }

        .corner3 {
            bottom: 20px;
            left: 20px;

            border-width: 0 0 2px 2px;
        }

        .corner4 {
            bottom: 20px;
            right: 20px;

            border-width: 0 2px 2px 0;
        }

        /* =========================
           ТЕЛЕФОН
        ========================= */

        @media (max-width: 600px) {

            body {
                overflow-y: auto;
                padding: 20px 0;
            }

            .card {
                padding: 45px 20px;
                width: 94%;
            }

            h1 {
                font-size: 27px;
            }

            .subtitle {
                font-size: 14px;
            }

            .social {
                width: 115px;
                height: 115px;
            }

            .social svg {
                width: 38px;
                height: 38px;
            }

            .socials {
                gap: 12px;
            }

            .logo {
                width: 75px;
                height: 75px;
                font-size: 34px;
            }
        }

        @media (max-width: 380px) {

            .social {
                width: 105px;
                height: 105px;
            }

            .social span {
                font-size: 12px;
            }
        }

    </style>
</head>
