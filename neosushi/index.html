<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Наши социальные сети — Neo Sushi</title>
</head>
<body>

    <div class="jp-circle"></div>

    <div class="katana katana-left">⚔</div>
    <div class="katana katana-right">⚔</div>

    <div class="chopsticks chopsticks-left"></div>
    <div class="chopsticks chopsticks-right"></div>

    <div class="food pizza1">🍕</div>
    <div class="food pizza2">🍕</div>
    <div class="food sushi1">🍣</div>
    <div class="food sushi2">🍱</div>
    <div class="food roll1">🍙</div>
    <div class="food roll2">🥟</div>
    <div class="food noodle">🍜</div>

    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>
    <div class="particle p4"></div>

    <div class="card">

        <div class="logo">
            <svg viewBox="0 0 210 100" xmlns="http://www.w3.org/2000/svg">
                <rect x="12" y="30" width="36" height="36" rx="8" fill="#e54d42" />
                <path d="M 15 35 Q 30 40 44 35 M 15 45 Q 30 50 44 45 M 15 55 Q 30 60 44 55" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" />
                <line x1="5" y1="75" x2="48" y2="20" stroke="#1b3320" stroke-width="3.5" stroke-linecap="round"/>
                <line x1="15" y1="78" x2="54" y2="24" stroke="#1b3320" stroke-width="3.5" stroke-linecap="round"/>
                <rect x="12" y="30" width="36" height="36" rx="8" fill="none" stroke="#ffffff" stroke-width="2.5" />
                <text x="54" y="58" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="26" fill="#e54d42">NEO</text>
                <text x="114" y="58" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="26" fill="#ffffff">SUSHI</text>
            </svg>
        </div>

        <div class="language">
            <button id="ruBtn" class="active" onclick="setLanguage('ru')">RU</button>
            <button id="kzBtn" onclick="setLanguage('kz')">KZ</button>
        </div>

        <h1 id="title">
            Мы в <span>социальных сетях</span>
        </h1>

        <p class="subtitle" id="subtitle">
            Следите за нашими новинками, смотрите блюда и оставляйте отзывы. Ваше мнение действительно важно для нас ❤️
        </p>

        <div class="divider">
            <span>✦</span>
        </div>

        <div class="socials">
            <a class="social instagram" href="https://www.instagram.com/neo_sushi_talgar" target="_blank">
                <svg viewBox="0 0 24 24">
                    <defs>
                        <linearGradient id="instagramGradient" x1="0%" y1="100%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#FFDC80" />
                            <stop offset="25%" stop-color="#FCB045" />
                            <stop offset="50%" stop-color="#F77737" />
                            <stop offset="75%" stop-color="#E1306C" />
                            <stop offset="100%" stop-color="#833AB4" />
                        </linearGradient>
                    </defs>
                    <path d="M7.5 2h9 A5.5 5.5 0 0 1 22 7.5v9 a5.5 5.5 0 0 1-5.5 5.5h-9 A5.5 5.5 0 0 1 2 16.5v-9 A5.5 5.5 0 0 1 7.5 2zm0 2 A3.5 3.5 0 0 0 4 7.5v9 A3.5 3.5 0 0 0 7.5 20h9 a3.5 3.5 0 0 0 3.5-3.5v-9 A3.5 3.5 0 0 0 16.5 4h-9z M12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2 a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm5.25-3.25 a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5z"/>
                </svg>
                <span id="instagramText">Instagram</span>
            </a>

            <a class="social gis" href="https://2gis.kz/almaty/firm/70000001105264153/tab/reviews?m=77.243734%2C43.314911%2F20" target="_blank">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2 C7.58 2 4 5.58 4 10 c0 5.5 8 12 8 12 s8-6.5 8-12 c0-4.42-3.58-8-8-8zm0 11.2 a3.2 3.2 0 1 1 0-6.4 3.2 3.2 0 0 1 0 6.4z"/>
                </svg>
                <span id="gisText">2GIS</span>
            </a>
        </div>

        <div class="review">
            ⭐ <strong id="reviewTitle">Ваше мнение важно!</strong>
            <br>
            <span id="reviewText">Оставьте отзыв после посещения — это помогает нам становиться лучше.</span>
        </div>

        <div class="bottom-text">
            <span id="bottomText">Спасибо, что выбираете нас</span> ♥
        </div>

    </div>

    <script>
    function setLanguage(language) {
        const title = document.getElementById("title");
        const subtitle = document.getElementById("subtitle");
        const reviewTitle = document.getElementById("reviewTitle");
        const reviewText = document.getElementById("reviewText");
        const bottomText = document.getElementById("bottomText");
        const ruBtn = document.getElementById("ruBtn");
        const kzBtn = document.getElementById("kzBtn");

        if (language === "kz") {
            title.innerHTML = 'Біз <span>әлеуметтік желілердеміз</span>';
            subtitle.innerHTML = 'Жаңалықтарымызды бақылаңыз, тағамдарымызды көріңіз және пікір қалдырыңыз. Сіздің пікіріңіз біз үшін өте маңызды ❤️';
            reviewTitle.innerHTML = 'Сіздің пікіріңіз маңызды!';
            reviewText.innerHTML = 'Қонақ болғаннан кейін пікір қалдырыңыз — бұл бізге одан әрі жақсаруға көмектеседі.';
            bottomText.innerHTML = 'Бізді таңдағаныңызға рақмет';

            kzBtn.classList.add("active");
            ruBtn.classList.remove("active");
        } else {
            title.innerHTML = 'Мы в <span>социальных сетях</span>';
            subtitle.innerHTML = 'Следите за нашими новинками, смотрите блюда и оставляйте отзывы. Ваше мнение действительно важно для нас ❤️';
            reviewTitle.innerHTML = 'Ваше мнение важно!';
            reviewText.innerHTML = 'Оставьте отзыв после посещения — это помогает нам становиться лучше.';
            bottomText.innerHTML = 'Спасибо, что выбираете нас';

            ruBtn.classList.add("active");
            kzBtn.classList.remove("active");
        }
    }
    </script>

</body>
</html>
