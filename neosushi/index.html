<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Наши социальные сети — Neo Sushi</title>

<style>

/* ===============================
   ОСНОВА
================================ */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {

    min-height: 100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    color: #172018;

    /* Более насыщенный и глубокий зеленый фон */
    background:

        radial-gradient(
            circle at 20% 20%,
            rgba(76, 175, 80, 0.35),
            transparent 40%
        ),

        radial-gradient(
            circle at 80% 80%,
            rgba(46, 125, 50, 0.30),
            transparent 45%
        ),

        radial-gradient(
            circle at 50% 50%,
            rgba(139, 195, 74, 0.20),
            transparent 60%
        ),

        linear-gradient(
            135deg,
            #e2f0d9,
            #c8e6c9,
            #dcedc8
        );

    overflow: hidden;

    position: relative;
}


/* Дополнительный зеленый узор/сетка на фоне */
body::after {

    content: "";

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    background-image: 
        radial-gradient(rgba(46, 125, 50, 0.1) 1px, transparent 1px);

    background-size: 24px 24px;

    pointer-events: none;

    z-index: 0;

}


/* ===============================
   ЯПОНСКИЕ КРУГИ
================================ */

.jp-circle {

    position: absolute;

    width: 550px;
    height: 550px;

    border-radius: 50%;

    border:
        2px solid
        rgba(46, 125, 50, 0.18);

    right: -200px;
    top: -180px;

    z-index: 0;

}

.jp-circle::after {

    content: "";

    position: absolute;

    width: 400px;
    height: 400px;

    border-radius: 50%;

    border:
        2px solid
        rgba(76, 175, 80, 0.18);

    top: 70px;
    left: 70px;

}


/* ===============================
   ЗЕЛЁНОЕ СВЕЧЕНИЕ
================================ */

body::before {

    content: "";

    position: absolute;

    width: 500px;
    height: 500px;

    border-radius: 50%;

    background:
        rgba(76, 175, 80, 0.25);

    filter: blur(100px);

    left: -150px;
    bottom: -150px;

    z-index: 0;

}


/* ===============================
   ЕДА
================================ */

.food {

    position: absolute;

    z-index: 1;

    pointer-events: none;

    user-select: none;

    opacity: .38;

    filter:
        drop-shadow(
            0 5px 10px
            rgba(46,125,50,.2)
        );

    animation:
        foodFloat 7s ease-in-out infinite;
}


/* Пицца */

.pizza1 {

    top: 8%;
    left: 8%;

    font-size: 58px;

    transform: rotate(-20deg);

}

.pizza2 {

    bottom: 9%;
    right: 8%;

    font-size: 48px;

    transform: rotate(20deg);

    animation-delay: 2s;

}


/* Суши */

.sushi1 {

    top: 18%;
    right: 10%;

    font-size: 48px;

    animation-delay: 1s;

}

.sushi2 {

    bottom: 18%;
    left: 9%;

    font-size: 44px;

    animation-delay: 3s;

}


/* Роллы */

.roll1 {

    top: 48%;
    left: 5%;

    font-size: 38px;

    animation-delay: 1.5s;

}

.roll2 {

    top: 55%;
    right: 5%;

    font-size: 40px;

    animation-delay: 2.5s;

}


/* Лапша */

.noodle {

    bottom: 5%;
    left: 45%;

    font-size: 35px;

    opacity: .25;

    animation-delay: 4s;

}


@keyframes foodFloat {

    0%,100% {

        transform:
            translateY(0)
            rotate(0deg);

    }

    50% {

        transform:
            translateY(-12px)
            rotate(5deg);

    }

}


/* ===============================
   КАТАНЫ
================================ */

.katana {

    position: absolute;

    z-index: 1;

    color: #2e4d30;

    opacity: .25;

    pointer-events: none;

    font-size: 150px;

    line-height: 1;

}


/* Левая катана */

.katana-left {

    left: -35px;
    top: 50%;

    transform:
        rotate(-25deg);

}


/* Правая катана */

.katana-right {

    right: -35px;
    top: 20%;

    transform:
        rotate(155deg);

}


/* ===============================
   ПАЛОЧКИ
================================ */

.chopsticks {

    position: absolute;

    z-index: 1;

    width: 180px;
    height: 8px;

    background:
        linear-gradient(
            90deg,
            #2e7d32,
            #81c784,
            #2e7d32
        );

    border-radius: 10px;

    opacity: .3;

    pointer-events: none;

}


.chopsticks::after {

    content: "";

    position: absolute;

    width: 180px;
    height: 8px;

    background:
        linear-gradient(
            90deg,
            #2e7d32,
            #81c784,
            #2e7d32
        );

    border-radius: 10px;

    top: 14px;
    left: 10px;

}


.chopsticks-left {

    left: -30px;
    bottom: 25%;

    transform:
        rotate(18deg);

}


.chopsticks-right {

    right: -30px;
    top: 30%;

    transform:
        rotate(-18deg);

}


/* ===============================
   ЧАСТИЦЫ
================================ */

.particle {

    position: absolute;

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #4caf50;

    box-shadow:
        0 0 12px
        rgba(76,175,80,.8);

    animation:
        pulse 3s infinite;

}


.p1 {
    top: 15%;
    left: 22%;
}

.p2 {
    top: 30%;
    right: 22%;
    animation-delay: .5s;
}

.p3 {
    bottom: 25%;
    left: 18%;
    animation-delay: 1s;
}

.p4 {
    bottom: 18%;
    right: 20%;
    animation-delay: 1.5s;
}


@keyframes pulse {

    0%,100% {
        transform: scale(.6);
        opacity: .3;
    }

    50% {
        transform: scale(1.7);
        opacity: .9;
    }

}


/* ===============================
   КАРТОЧКА
================================ */

.card {

    position: relative;

    z-index: 10;

    width: 92%;
    max-width: 680px;

    padding: 48px 38px;

    text-align: center;

    background:
        rgba(255,255,255,.95);

    border-radius: 28px;

    border:
        1.5px solid
        rgba(76,175,80,.35);

    box-shadow:

        0 25px 70px
        rgba(46,125,50,.20),

        0 0 45px
        rgba(139,195,74,.15);

    animation:
        appear .8s ease;

}


@keyframes appear {

    from {

        opacity: 0;

        transform:
            translateY(30px)
            scale(.97);

    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* ===============================
   ДЕКОР КАРТОЧКИ
================================ */

.card::before {

    content: "";

    position: absolute;

    top: 0;
    left: 12%;

    width: 76%;
    height: 4px;

    background:

        linear-gradient(
            90deg,
            transparent,
            #2e7d32,
            #8bc34a,
            #2e7d32,
            transparent
        );

    border-radius: 10px;

}


/* ===============================
   ЛОГО
================================ */

.logo {

    width: 120px;
    height: 120px;

    margin:
        0 auto 22px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #8bc34a 0%,
            #4caf50 65%,
            #1b5e20 100%
        );

    padding: 10px;

    box-shadow:

        0 10px 25px
        rgba(46,125,50,.4);

    animation:
        logoFloat 3s ease-in-out infinite;

}

.logo svg {

    width: 100%;
    height: 100%;

    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));

}


@keyframes logoFloat {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-6px);
    }

}


/* ===============================
   ЯЗЫК
================================ */

.language {

    display: flex;

    justify-content: center;

    gap: 6px;

    margin-bottom: 20px;

}


.language button {

    border: 1px solid rgba(76,175,80,.3);

    background:
        #eef7eb;

    color:
        #2e7d32;

    padding:
        6px 14px;

    border-radius:
        20px;

    cursor: pointer;

    font-size: 11px;

    font-weight: bold;

    transition: .25s;

}


.language button.active {

    background:
        #388e3c;

    color: white;

    border-color: #388e3c;

    box-shadow:
        0 4px 12px
        rgba(56,142,60,.3);

}


.language button:hover {

    background:
        #4caf50;

    color: white;

}


/* ===============================
   ЗАГОЛОВОК
================================ */

h1 {

    font-size: 32px;

    margin-bottom: 12px;

    color:
        #1b3320;

}


h1 span {

    color:
        #2e7d32;

}


/* ===============================
   ТЕКСТ
================================ */

.subtitle {

    max-width: 520px;

    margin:
        0 auto 27px;

    color:
        #556857;

    font-size: 14px;

    line-height: 1.7;

}


/* ===============================
   РАЗДЕЛИТЕЛЬ
================================ */

.divider {

    display: flex;

    align-items: center;

    gap: 12px;

    width: 80%;

    margin:
        0 auto 28px;

}


.divider::before,
.divider::after {

    content: "";

    height: 1px;

    flex: 1;

    background:

        linear-gradient(
            90deg,
            transparent,
            #8bc34a
        );

}


.divider::after {

    background:

        linear-gradient(
            90deg,
            #8bc34a,
            transparent
        );

}


.divider span {

    color:
        #4caf50;

    font-size: 15px;

}


/* ===============================
   СОЦИАЛЬНЫЕ КНОПКИ
================================ */

.socials {

    display: flex;

    justify-content: center;

    gap: 18px;

}


.social {

    position: relative;

    width: 180px;
    height: 130px;

    display: flex;

    flex-direction: column;

    justify-content: center;
    align-items: center;

    text-decoration: none;

    background:
        #f4f9f2;

    border-radius: 22px;

    border:
        1px solid
        #c8e6c9;

    transition:
        transform .3s ease,
        box-shadow .3s ease,
        border-color .3s ease;

}


.social::before {

    content: "";

    position: absolute;

    width: 100px;
    height: 100px;

    border-radius: 50%;

    background:
        rgba(76,175,80,.12);

    filter: blur(20px);

    transition: .3s;

}


.social:hover::before {

    transform: scale(1.4);

    background:
        rgba(76,175,80,.25);

}


.social:hover {

    transform:
        translateY(-8px);

    border-color:
        #4caf50;

    box-shadow:

        0 15px 30px
        rgba(46,125,50,.2);

}


.social svg {

    position: relative;

    z-index: 2;

    width: 48px;
    height: 48px;

    margin-bottom: 10px;

}


.social span {

    position: relative;

    z-index: 2;

    font-size: 14px;

    font-weight: bold;

    color: #1b3320;

}


/* ===============================
   INSTAGRAM
================================ */

.instagram svg {

    fill: url(#instagramGradient);

}


/* ===============================
   2GIS
================================ */

.gis svg {

    fill: #00a651;

}


/* ===============================
   ОТЗЫВ
================================ */

.review {

    margin-top: 25px;

    padding:
        14px 18px;

    border-radius:
        15px;

    background:
        #eef7eb;

    border:
        1px solid
        #c8e6c9;

    color:
        #556857;

    font-size:
        12px;

    line-height:
        1.6;

}


.review strong {

    color:
        #2e7d32;

}


/* ===============================
   НИЖНИЙ ТЕКСТ
================================ */

.bottom-text {

    margin-top: 22px;

    color:
        #819c83;

    font-size:
        10px;

    letter-spacing:
        1.5px;

}


.bottom-text span {

    color:
        #2e7d32;

    font-weight: bold;

}


/* ===============================
   МОБИЛЬНЫЙ
================================ */

@media (max-width: 600px) {

    body {

        overflow-y: auto;

        padding: 20px 0;

    }


    .card {

        width: 94%;

        padding:
            38px 17px;

    }


    h1 {

        font-size:
            26px;

    }


    .subtitle {

        font-size:
            13px;

    }


    .socials {

        gap:
            10px;

    }


    .social {

        width:
            140px;

        height:
            120px;

    }


    .social svg {

        width:
            40px;

        height:
            40px;

    }


    .logo {

        width:
            95px;

        height:
            95px;

    }


    .food {

        font-size:
            30px;

        opacity:
            .22;

    }


    .katana {

        opacity:
            .12;

    }


    .chopsticks {

        opacity:
            .15;

    }

}


@media (max-width: 380px) {

    .social {

        width:
            125px;

        height:
            115px;

    }

}

</style>

</head>


<body>


<div class="jp-circle"></div>


<div class="katana katana-left">
    ⚔
</div>

<div class="katana katana-right">
    ⚔
</div>


<div class="chopsticks chopsticks-left"></div>

<div class="chopsticks chopsticks-right"></div>


<div class="food pizza1">🍕</div>

<div class="food pizza2">🍕</div>

<div class="food sushi1">🍣</div>

<div class="food sushi2">🍱</div>

<div class="food roll1">🍙</div>

<div class="food roll2">🥟</div>

<div class="food noodle">🍜</div>

<div class="particle p2"></div>

<div class="particle p4"></div>


<div class="card">


    <div class="logo">
        <svg viewBox="0 0 210 100" xmlns="http://www.w3.org/2000/svg">
            <rect x="12" y="30" width="36" height="36" rx="8" fill="#e54d42" />
            <path d="M 15 35 Q 30 40 44 35 M 15 45 Q 30 50 44 45 M 15 55 Q 30 60 44 55" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" />

            <line x1="15" y1="78" x2="54" y2="24" stroke="#1b3320" stroke-width="3.5" stroke-linecap="round"/>

            <text x="54" y="58" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="26" fill="#e54d42">NEO</text>
            
            <text x="114" y="58" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="26" fill="#ffffff">SUSHI</text>
        </svg>
    </div>


    <div class="language">

        <button
            id="ruBtn"
            class="active"
            onclick="setLanguage('ru')">

            RU

        </button>

        <button
            id="kzBtn"
            onclick="setLanguage('kz')">

            KZ

        </button>

    </div>


    <h1 id="title">

        Мы в
        <span>социальных сетях</span>

    </h1>


    <p
        class="subtitle"
        id="subtitle">

    <div class="socials">


        <a
            class="social instagram"

        >

                <defs>

                    <linearGradient
                        id="instagramGradient"

                    >

                        <stop
                            offset="0%"

                        />

                        />

                        />

        <a

    </div>


    <div class="review">

</div>


<script>

function setLanguage(language) {

    const title =
        document.getElementById("title");

    const subtitle =
        document.getElementById("subtitle");

    const reviewTitle =
        document.getElementById("reviewTitle");

    const reviewText =
        document.getElementById("reviewText");

    const bottomText =
        document.getElementById("bottomText");

    const ruBtn =
        document.getElementById("ruBtn");

    const kzBtn =
        document.getElementById("kzBtn");


    if (language === "kz") {

        title.innerHTML =
            'Біз <span>әлеуметтік желілердеміз</span>';

        subtitle.innerHTML =
            'Жаңалықтарымызды бақылаңыз, ' +
            'тағамдарымызды көріңіз және пікір қалдырыңыз. ' +
            'Сіздің пікіріңіз біз үшін өте маңызды ❤️';

        reviewTitle.innerHTML =
            'Сіздің пікіріңіз маңызды!';

        reviewText.innerHTML =
            'Қонақ болғаннан кейін пікір қалдырыңыз — ' +
            'бұл бізге одан әрі жақсаруға көмектеседі.';

        bottomText.innerHTML =
            'Бізді таңдағаныңызға рақмет';

        kzBtn.classList.add("active");
        ruBtn.classList.remove("active");

    }

    else {

        title.innerHTML =
            'Мы в <span>социальных сетях</span>';

        subtitle.innerHTML =
            'Следите за нашими новинками, ' +
            'смотрите блюда и оставляйте отзывы. ' +
            'Ваше мнение действительно важно для нас ❤️';

        reviewTitle.innerHTML =
            'Ваше мнение важно!';

        reviewText.innerHTML =
            'Оставьте отзыв после посещения — ' +
            'это помогает нам становиться лучше.';

        bottomText.innerHTML =
            'Спасибо, что выбираете нас';

        ruBtn.classList.add("active");
        kzBtn.classList.remove("active");

    }

}

</script>
