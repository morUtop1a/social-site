<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Наши социальные сети</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at 20% 20%, #ffdddd 0%, transparent 25%),
                radial-gradient(circle at 80% 80%, #ffd5d5 0%, transparent 25%),
                #ffffff;

            overflow: hidden;
        }

        /* Красные декоративные круги */

        .circle {
            position: absolute;
            border-radius: 50%;
            background: #e60012;
            opacity: 0.08;
        }

        .circle1 {
            width: 350px;
            height: 350px;
            top: -150px;
            left: -120px;
        }

        .circle2 {
            width: 300px;
            height: 300px;
            bottom: -120px;
            right: -100px;
        }

        .circle3 {
            width: 100px;
            height: 100px;
            top: 15%;
            right: 15%;
        }

        /* Основная карточка */

        .card {
            position: relative;
            z-index: 2;

            width: 90%;
            max-width: 650px;

            padding: 55px 35px;

            text-align: center;

            background: rgba(255, 255, 255, 0.9);

            border-radius: 30px;

            box-shadow:
                0 20px 60px rgba(180, 0, 0, 0.15);

            border: 1px solid #ffe0e0;

            animation: appear 0.8s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Верхний логотип */

        .logo {
            width: 80px;
            height: 80px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #e60012;
            color: white;

            border-radius: 50%;

            font-size: 38px;

            box-shadow:
                0 10px 30px rgba(230, 0, 18, 0.3);

            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        h1 {
            color: #1a1a1a;
            font-size: 34px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            font-size: 16px;
            margin-bottom: 35px;
        }

        /* Социальные кнопки */

        .socials {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .social {
            width: 120px;
            height: 120px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-decoration: none;

            color: #222;

            background: white;

            border-radius: 22px;

            border: 2px solid #f1f1f1;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease,
                color 0.3s ease;
        }

        .social svg {
            width: 42px;
            height: 42px;

            margin-bottom: 10px;

            fill: currentColor;
        }

        .social span {
            font-size: 13px;
            font-weight: bold;
        }

        .social:hover {
            transform: translateY(-10px);

            box-shadow:
                0 15px 35px rgba(230, 0, 18, 0.18);

            border-color: #e60012;

            color: #e60012;
        }

        /* Красная кнопка */

        .instagram {
            color: #e60012;
        }

        /* Нижний текст */

        .bottom-text {
            margin-top: 35px;

            font-size: 11px;

            color: #aaa;

            letter-spacing: 1px;
        }

        .bottom-text:hover {
            color: #e60012;
        }

        /* Декоративные точки */

        .dots {
            position: absolute;

            width: 8px;
            height: 8px;

            background: #e60012;

            border-radius: 50%;

            opacity: 0.5;

            animation: pulse 2s infinite;
        }

        .dot1 {
            top: 15%;
            left: 10%;
        }

        .dot2 {
            top: 70%;
            left: 7%;

            animation-delay: 0.5s;
        }

        .dot3 {
            top: 25%;
            right: 8%;

            animation-delay: 1s;
        }

        .dot4 {
            bottom: 12%;
            right: 15%;

            animation-delay: 1.5s;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.3;
            }

            50% {
                transform: scale(1.7);
                opacity: 0.8;
            }
        }

        /* Адаптация под телефон */

        @media (max-width: 500px) {

            .card {
                padding: 40px 20px;
            }

            h1 {
                font-size: 27px;
            }

            .social {
                width: 100px;
                height: 100px;
            }

            .social svg {
                width: 35px;
                height: 35px;
            }
        }
    </style>
</head>

<body>

    <!-- Декоративные элементы -->

    <div class="circle circle1"></div>
    <div class="circle circle2"></div>
    <div class="circle circle3"></div>

    <div class="dots dot1"></div>
    <div class="dots dot2"></div>
    <div class="dots dot3"></div>
    <div class="dots dot4"></div>


    <!-- Основная карточка -->

    <div class="card">

        <div class="logo">
            ♥
        </div>

        <h1>Мы в социальных сетях</h1>

        <p class="subtitle">
            Подписывайтесь и следите за нами, а так же оставьте свой отзыв, это важно для нас
        </p>
        


        <div class="socials">

            <!-- INSTAGRAM -->

            <a class="social instagram"
               href="https://www.instagram.com/nurikfckdp/"
               target="_blank">

                <svg viewBox="0 0 24 24">
                    <path d="M7.5 2h9A5.5 5.5 0 0 1 22 7.5v9a5.5 5.5 0 0 1-5.5 5.5h-9A5.5 5.5 0 0 1 2 16.5v-9A5.5 5.5 0 0 1 7.5 2zm0 2A3.5 3.5 0 0 0 4 7.5v9A3.5 3.5 0 0 0 7.5 20h9a3.5 3.5 0 0 0 3.5-3.5v-9A3.5 3.5 0 0 0 16.5 4h-9zM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm5.25-3.25a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5z"/>
                </svg>

                <span>Instagram</span>

            </a>


            <!-- 2GIS -->

            <a class="social"
               href="https://2gis.kz/almaty/geo/70030076214424979/77.256014%2C43.336449?m=77.256671%2C43.336113%2F18.68"
               target="_blank">

                <svg viewBox="0 0 24 24">
                    <path d="M12 2C7.58 2 4 5.58 4 10c0 5.5 8 12 8 12s8-6.5 8-12c0-4.42-3.58-8-8-8zm0 11.2a3.2 3.2 0 1 1 0-6.4 3.2 3.2 0 0 1 0 6.4z"/>
                </svg>

                <span>2GIS</span>

            </a>


            <!-- TIKTOK -->

            <a class="social"
               href="https://www.tiktok.com/@volyanskiy.arm?lang=ru-RU"
               target="_blank">

                <svg viewBox="0 0 24 24">
                    <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-3.77V2h-3.5v13.67a2.9 2.9 0 1 1-2-2.76V9.37a6.4 6.4 0 1 0 5.5 6.3V9.26a8.2 8.2 0 0 0 4.8 1.55V7.3a4.83 4.83 0 0 1-1.03-.61z"/>
                </svg>

                <span>TikTok</span>

            </a>

        </div>
    </div>

</body>
</html>
